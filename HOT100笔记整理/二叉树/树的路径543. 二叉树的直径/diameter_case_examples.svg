<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #222; }
      .subtitle { font: 600 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #333; }
      .label { font: 500 16px Consolas, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 500 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #444; }
      .normal-edge { stroke: #a0a7b4; stroke-width: 4; }
      .dia-edge { stroke: #e53935; stroke-width: 6; }
      .node { fill: #3f6fd9; stroke: #ffffff; stroke-width: 3; }
      .dia-node { fill: #ef5350; stroke: #ffffff; stroke-width: 3; }
      .panel { fill: #fafbff; stroke: #d7dcea; stroke-width: 2; rx: 14; }
      .split { stroke: #d7dcea; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <text x="600" y="46" class="title" text-anchor="middle">直径的两种形态</text>
  <text x="300" y="82" class="subtitle" text-anchor="middle">Case 1：直径 = 根到叶子的最长路径</text>
  <text x="900" y="82" class="subtitle" text-anchor="middle">Case 2：直径 = 叶子 -&gt; 拐点 -&gt; 叶子</text>
  <line x1="600" y1="100" x2="600" y2="730" class="split" />

  <rect x="40" y="110" width="520" height="280" class="panel" />
  <line x1="360" y1="170" x2="320" y2="230" class="dia-edge"/>
  <line x1="320" y1="230" x2="280" y2="290" class="dia-edge"/>
  <line x1="280" y1="290" x2="240" y2="350" class="dia-edge"/>
  <circle cx="360" cy="170" r="20" class="dia-node"/><text x="360" y="170" class="label">1</text>
  <circle cx="320" cy="230" r="20" class="dia-node"/><text x="320" y="230" class="label">2</text>
  <circle cx="280" cy="290" r="20" class="dia-node"/><text x="280" y="290" class="label">3</text>
  <circle cx="240" cy="350" r="20" class="dia-node"/><text x="240" y="350" class="label">4</text>

  <rect x="40" y="430" width="520" height="280" class="panel" />
  <line x1="288" y1="490" x2="338" y2="550" class="dia-edge"/>
  <line x1="338" y1="550" x2="298" y2="610" class="dia-edge"/>
  <line x1="298" y1="610" x2="348" y2="670" class="dia-edge"/>
  <line x1="298" y1="610" x2="253" y2="670" class="normal-edge"/>
  <circle cx="288" cy="490" r="20" class="dia-node"/><text x="288" y="490" class="label">1</text>
  <circle cx="338" cy="550" r="20" class="dia-node"/><text x="338" y="550" class="label">2</text>
  <circle cx="298" cy="610" r="20" class="dia-node"/><text x="298" y="610" class="label">3</text>
  <circle cx="348" cy="670" r="20" class="dia-node"/><text x="348" y="670" class="label">4</text>
  <circle cx="253" cy="670" r="20" class="node"/><text x="253" y="670" class="label">5</text>

  <rect x="640" y="110" width="520" height="280" class="panel" />
  <line x1="900" y1="170" x2="830" y2="250" class="normal-edge"/>
  <line x1="900" y1="170" x2="970" y2="250" class="normal-edge"/>
  <line x1="830" y1="250" x2="790" y2="330" class="dia-edge"/>
  <line x1="830" y1="250" x2="870" y2="330" class="normal-edge"/>
  <line x1="970" y1="250" x2="930" y2="330" class="normal-edge"/>
  <line x1="970" y1="250" x2="1010" y2="330" class="dia-edge"/>
  <line x1="830" y1="250" x2="900" y2="170" class="dia-edge"/>
  <line x1="900" y1="170" x2="970" y2="250" class="dia-edge"/>
  <circle cx="900" cy="170" r="20" class="dia-node"/><text x="900" y="170" class="label">1</text>
  <circle cx="830" cy="250" r="20" class="dia-node"/><text x="830" y="250" class="label">2</text>
  <circle cx="970" cy="250" r="20" class="dia-node"/><text x="970" y="250" class="label">3</text>
  <circle cx="790" cy="330" r="20" class="dia-node"/><text x="790" y="330" class="label">4</text>
  <circle cx="870" cy="330" r="20" class="node"/><text x="870" y="330" class="label">5</text>
  <circle cx="930" cy="330" r="20" class="node"/><text x="930" y="330" class="label">6</text>
  <circle cx="1010" cy="330" r="20" class="dia-node"/><text x="1010" y="330" class="label">7</text>

  <rect x="640" y="430" width="520" height="280" class="panel" />
  <line x1="955" y1="455" x2="895" y2="525" class="normal-edge"/>
  <line x1="895" y1="525" x2="845" y2="595" class="dia-edge"/>
  <line x1="895" y1="525" x2="945" y2="595" class="dia-edge"/>
  <line x1="845" y1="595" x2="845" y2="655" class="dia-edge"/>
  <circle cx="955" cy="455" r="20" class="node"/><text x="955" y="455" class="label">1</text>
  <circle cx="895" cy="525" r="20" class="dia-node"/><text x="895" y="525" class="label">2</text>
  <circle cx="845" cy="595" r="20" class="dia-node"/><text x="845" y="595" class="label">4</text>
  <circle cx="945" cy="595" r="20" class="dia-node"/><text x="945" y="595" class="label">5</text>
  <circle cx="845" cy="655" r="20" class="dia-node"/><text x="845" y="655" class="label">6</text>
</svg>
