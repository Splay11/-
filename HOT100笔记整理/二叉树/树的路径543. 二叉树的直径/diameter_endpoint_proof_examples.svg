  <rect x="40" y="84" width="520" height="440" class="panel"/>
  <text x="300" y="118" class="subtitle" text-anchor="middle">&#20363;1&#65306;&#31471;&#28857;&#19981;&#26159;&#26681;&#33410;&#28857;</text>

  <line x1="300" y1="190" x2="300" y2="260" class="edge"/>
