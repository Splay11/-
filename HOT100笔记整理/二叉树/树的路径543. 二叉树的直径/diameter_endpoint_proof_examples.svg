<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <defs>
    <style>
      .title { font: 700 28px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #222; }
      .subtitle { font: 600 20px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #333; }
      .note { font: 500 16px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #444; }
      .label { font: 600 16px Consolas, monospace; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .panel { fill: #fafbff; stroke: #d7dcea; stroke-width: 2; rx: 14; }
      .edge { stroke: #a0a7b4; stroke-width: 4; }
      .bad-path { stroke: #ff9800; stroke-width: 6; }
      .better-path { stroke: #e53935; stroke-width: 6; }
      .node { fill: #3f6fd9; stroke: #ffffff; stroke-width: 3; }
      .good-node { fill: #e53935; stroke: #ffffff; stroke-width: 3; }
      .bad-node { fill: #ff9800; stroke: #ffffff; stroke-width: 3; }
      .dash { stroke: #777; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <text x="600" y="44" class="title" text-anchor="middle">&#19968;&#23450;&#19981;&#20250;&#26159;&#30452;&#24452;&#30340;&#24773;&#20917;</text>
